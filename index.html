<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Interactive Web Page</h1>
    </header>

    <section>
        <p id="text">This is some text that will change.</p>
        <button id="changeTextBtn">Change Text</button>
    </section>

    <section>
        <button id="changeStyleBtn">Change Background Color</button>
    </section>

    <section>
        <button id="addElementBtn">Add New Element</button>
        <button id="removeElementBtn">Remove Element</button>
        <div id="elementsContainer"></div>
    </section>

    <footer>
        <p>&copy; 2025 Interactive Web Page</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
